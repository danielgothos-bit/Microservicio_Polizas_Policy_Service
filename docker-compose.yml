services:
  policy_service:
    build: .
    container_name: policy_service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/policy_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis

  policy_worker:
    build: .
    container_name: policy_worker
    command: celery -A comun.celery_app worker -Q policy --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/policy_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: policy_db
    environment:
      POSTGRES_DB: policy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: policy_redis
    ports:
      - "6382:6379"

volumes:
  postgres_data:
