services:
  - type: web
    name: policy-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: policy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: policy-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Mismo valor en TODOS los microservicios (autentica la entrega de eventos).
      - key: INTERNAL_TOKEN
        sync: false
      - key: DEBUG
        value: "0"
      - key: RUN_WORKER_IN_WEB
        value: "1"
      # Los servicios gratis tardan ~1 minuto en despertar.
      - key: SYNC_TIMEOUT
        value: "60"
      # URL pública del microservicio de Asegurados (ej: https://policyholder-service-xxxx.onrender.com)
      - key: POLICYHOLDER_SERVICE_URL
        sync: false

  - type: keyvalue
    name: policy-redis
    plan: free
    ipAllowList: []

databases:
  - name: policy-db
    databaseName: policy_db
    user: policy_user
    plan: free
